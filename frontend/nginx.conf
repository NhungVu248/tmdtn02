server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS nội bộ của Docker để phân giải tên service "backend" lúc chạy.
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Chuyển tiếp API sang backend nội bộ — nhờ vậy KHÔNG cần mở cổng 4000 ra máy host,
  # trình duyệt chỉ cần nói chuyện với cổng 8080 (tránh hẳn xung đột cổng 4000).
  location /api/ {
    set $upstream http://backend:4000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m; # cho phép tải ảnh đánh giá (tối đa 6 ảnh)
  }

  # Ảnh người dùng tải lên được backend phục vụ tại /uploads.
  location /uploads/ {
    set $upstream http://backend:4000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }

  # Cache tài nguyên tĩnh
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # SPA: mọi đường dẫn không phải file tĩnh đều trả về index.html (React Router xử lý)
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Khối location dùng chung cho cả HTTP (:80, qua tunnel/ngrok) và HTTPS (:443, LAN trực tiếp).
# Tách ra file để không lặp code giữa 2 server block.
# (nginx không có "include inline" gọn hơn nên ta lặp tối thiểu qua biến $upstream.)

# HTTP :80 — phục vụ trực tiếp (ngrok/cloudflared cấp HTTPS công khai ở ngoài).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location /api/ {
    set $upstream http://backend:4000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }
  location /uploads/ {
    set $upstream http://backend:4000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# HTTPS :443 — truy cập trực tiếp trong LAN (chứng chỉ tự ký).
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location /api/ {
    set $upstream http://backend:4000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }
  location /uploads/ {
    set $upstream http://backend:4000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
